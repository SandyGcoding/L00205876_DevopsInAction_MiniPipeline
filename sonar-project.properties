#Identify SonarQube project
sonar.projectKey=ButtersVeg
sonar.projectName=ButtersVeg

#Analyse app code and identify automated test files
sonar.sources=Code
sonar.tests=Tests

#Exclude original file
sonar.exclusions=Code/Veg.py
#Import PyTest Coverage Report
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

#FFail pipeline if quality standards are not met
sonar.qualitygate.wait=true
#Allow 5mins for Quality Gate result
sonar.qualitygate.timeout=300
