name: Docker Image CI

on:
  push:
    branches: [ "main", "Docker"]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Build Maven JAR
      run: mvn -B -f Build_using_Maven/butters-veg/pom.xml clean package
    - name: Build the Docker image
      run: docker build -f Docker/DockerFile -t butters-veg:$(date +%s) Build_using_Maven/butters-veg
