name: Butters Veg EC2 Deploy

# Only a successful ECR release on main can trigger an automatic EC2 deployment.
# This single workflow creates the stack automatically on the first deployment.
# The original infrastructure template remains in EC2/buttersveg-ec2.yml.
# AWS prerequisite: the existing GitHub OIDC role must have authorised CloudFormation
# change-set/read operations and the underlying EC2, IAM, Logs, SSM and Scheduler
# permissions for this template (or an approved CloudFormation execution role).
# GitHub's permissions below do not grant AWS permissions. No self-grant is performed.
# Repository variable ALLOWED_IPV4_CIDR must contain the approved public IPv4 /32.
on:
  workflow_run:
    workflows: ["Butters Veg ECR Release"]
    types: [completed]
  workflow_dispatch:  # DEVELOPMENT ONLY: restart a stopped EC2 without a new release.

permissions:
  contents: read
  actions: read  # Read the exact release tag from the completed release job's logs.
  id-token: write

concurrency:
  group: butters-veg-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: eu-north-1
      STACK_NAME: buttersveg-ec2
      ALLOWED_IPV4_CIDR: ${{ vars.ALLOWED_IPV4_CIDR }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Check out trusted infrastructure template from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Recover the exact Docker image released by ECR Release
        shell: bash
        run: |
          set -euo pipefail
          # ECR Release prints "Released image in ECR as release-<SHA>"
          # or "Already released: release-<SHA>". Read that successful run's log.
          gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/ecr-release.log
          LINE=$(grep -E '(Released image in ECR as |Already released: )release-[0-9a-f]{40}' /tmp/ecr-release.log | tail -n 1 || true)
          IMAGE_TAG=$(printf '%s\n' "$LINE" | grep -Eo 'release-[0-9a-f]{40}' | tail -n 1 || true)
          [[ "$IMAGE_TAG" =~ ^release-[0-9a-f]{40}$ ]] || {
            echo 'Could not determine the release image tag from the successful ECR Release run.' >&2
            exit 1
          }
          echo "RELEASE_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${IMAGE_TAG#release-}" >> "$GITHUB_ENV"
          echo "Deploying $IMAGE_TAG"

      - name: Authenticate with AWS using existing GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Validate inputs and confirm released image exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CIDR'
          import ipaddress, os
          value = os.environ['ALLOWED_IPV4_CIDR']
          try:
              network = ipaddress.IPv4Network(value, strict=True)
              assert network.prefixlen == 32 and network.network_address.is_global
          except (ValueError, AssertionError):
              raise SystemExit('Set ALLOWED_IPV4_CIDR to the approved public IPv4 address with /32.')
          PY_CIDR
          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://EC2/buttersveg-ec2.yml >/dev/null
          DIGEST=$(aws ecr batch-get-image \
            --region "$AWS_REGION" \
            --repository-name butters-veg \
            --image-ids "imageTag=$RELEASE_IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          [[ "$DIGEST" != None && -n "$DIGEST" ]] || {
            echo 'The image named in the successful release could not be found in ECR.' >&2
