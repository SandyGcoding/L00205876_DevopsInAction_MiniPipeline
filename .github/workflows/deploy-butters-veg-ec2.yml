name: Butters Veg EC2 Deploy

# Only a successful ECR release on main can trigger an automatic EC2 deployment.
# This single workflow creates the stack automatically on the first deployment.
# The original infrastructure template remains in EC2/butters-veg-ec2.yml.
# AWS prerequisite: the existing GitHub OIDC role must have authorised CloudFormation
# change-set/read operations and the underlying EC2, IAM, Logs, SSM and Scheduler
# permissions for this template (or an approved CloudFormation execution role).
# GitHub's permissions below do not grant AWS permissions. No self-grant is performed.
# Repository variable ALLOWED_IPV4_CIDR must contain the approved public IPv4 /32.
on:
  workflow_run:
    workflows: ["Butters Veg ECR Release"]
    types: [completed]
  workflow_dispatch:  # DEVELOPMENT ONLY: restart a stopped EC2 without a new release.

permissions:
  contents: read
  actions: read  # Read the exact release tag from the completed release job's logs.
  id-token: write

concurrency:
  group: butters-veg-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: eu-north-1
      STACK_NAME: butters-veg-ec2
      ALLOWED_IPV4_CIDR: ${{ vars.ALLOWED_IPV4_CIDR }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Check out trusted infrastructure template from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Recover the exact Docker image released by ECR Release
        shell: bash
        run: |
          set -euo pipefail
          # ECR Release prints "Released image in ECR as release-<SHA>"
          # or "Already released: release-<SHA>". Read that successful run's log.
          gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > /tmp/ecr-release.log
          LINE=$(grep -E '(Released image in ECR as |Already released: )release-[0-9a-f]{40}' /tmp/ecr-release.log | tail -n 1 || true)
          IMAGE_TAG=$(printf '%s\n' "$LINE" | grep -Eo 'release-[0-9a-f]{40}' | tail -n 1 || true)
          [[ "$IMAGE_TAG" =~ ^release-[0-9a-f]{40}$ ]] || {
            echo 'Could not determine the release image tag from the successful ECR Release run.' >&2
            exit 1
          }
          echo "RELEASE_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=${IMAGE_TAG#release-}" >> "$GITHUB_ENV"
          echo "Deploying $IMAGE_TAG"

      - name: Authenticate with AWS using existing GitHub OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Validate inputs and confirm released image exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_CIDR'
          import ipaddress, os
          value = os.environ['ALLOWED_IPV4_CIDR']
          try:
              network = ipaddress.IPv4Network(value, strict=True)
              assert network.prefixlen == 32 and network.network_address.is_global
          except (ValueError, AssertionError):
              raise SystemExit('Set ALLOWED_IPV4_CIDR to the approved public IPv4 address with /32.')
          PY_CIDR
          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body file://EC2/butters-veg-ec2.yml >/dev/null
          DIGEST=$(aws ecr batch-get-image \
            --region "$AWS_REGION" \
            --repository-name butters-veg \
            --image-ids "imageTag=$RELEASE_IMAGE_TAG" \
            --query 'images[0].imageId.imageDigest' --output text)
          [[ "$DIGEST" != None && -n "$DIGEST" ]] || {
            echo 'The image named in the successful release could not be found in ECR.' >&2
            exit 1
          }
          SOURCE_DIGEST=$(aws ecr batch-get-image \
            --region "$AWS_REGION" --repository-name butters-veg \
            --image-ids "imageTag=$IMAGE_SHA" \
            --query 'images[0].imageId.imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SOURCE_DIGEST" == "$DIGEST" ]] || {
            echo 'Release and original image digests do not match.' >&2; exit 1;
          }
          echo "Verified released image digest $DIGEST"

      - name: Create or update the EC2 CloudFormation stack (review changes first)
        shell: bash
        run: |
          set -euo pipefail
          # Same stack and original infrastructure template as the manual deployment.
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" >/tmp/butters-veg-stack.json 2>/tmp/butters-veg-stack.error; then
            TYPE=UPDATE
            CURRENT_STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)
            case "$CURRENT_STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "Stack is not ready for an update: $CURRENT_STATUS" >&2; exit 1 ;;
            esac
            # Ordinary application releases must not update the infrastructure or
            # implicitly refresh the latest AMI. Compare the deployed original
            # template and approved CIDR before creating an UPDATE change set.
            aws cloudformation get-template --stack-name "$STACK_NAME" \
              --template-stage Original --region "$AWS_REGION" \
              --query TemplateBody --output json >/tmp/butters-veg-template.json
            if python3 - <<'PY_COMPARE'
          import json, os
          from pathlib import Path
          deployed = json.loads(Path('/tmp/butters-veg-template.json').read_text())
          desired = Path('EC2/butters-veg-ec2.yml').read_text()
          stack = json.loads(Path('/tmp/butters-veg-stack.json').read_text())['Stacks'][0]
          params = {p['ParameterKey']: p['ParameterValue'] for p in stack.get('Parameters', [])}
          def normalize(value):
              return '\n'.join(line.rstrip() for line in value.splitlines()).strip()
          identical = (isinstance(deployed, str) and normalize(deployed) == normalize(desired)
                       and params.get('AllowedIpv4Cidr') == os.environ['ALLOWED_IPV4_CIDR'])
          raise SystemExit(0 if identical else 1)
          PY_COMPARE
            then
              echo 'Infrastructure template and access CIDR unchanged; retaining existing stack.'
              exit 0
            fi
          elif grep -qi 'does not exist' /tmp/buttersveg-stack.error; then
            TYPE=CREATE
          else
            cat /tmp/buttersveg-stack.error >&2
            exit 1
          fi

          CHANGE_SET="buttersveg-ec2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$TYPE" == CREATE ]]; then
            PARAMS=(
              "ParameterKey=ImageTag,ParameterValue=$IMAGE_SHA"
              "ParameterKey=AllowedIpv4Cidr,ParameterValue=$ALLOWED_IPV4_CIDR"
            )
          else
            # Avoid changing EC2 UserData on routine image updates. SSM updates Docker below.
            PARAMS=(
              'ParameterKey=ImageTag,UsePreviousValue=true'
              "ParameterKey=AllowedIpv4Cidr,ParameterValue=$ALLOWED_IPV4_CIDR"
              'ParameterKey=InstanceType,UsePreviousValue=true'
              'ParameterKey=LatestAmiId,UsePreviousValue=true'
            )
          fi

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" --change-set-name "$CHANGE_SET" \
            --change-set-type "$TYPE" --template-body file://EC2/buttersveg-ec2.yml \
            --parameters "${PARAMS[@]}" --capabilities CAPABILITY_IAM \
            --region "$AWS_REGION" >/dev/null

          STATUS='CREATE_PENDING'
          for attempt in $(seq 1 60); do
            STATUS=$(aws cloudformation describe-change-set --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET" --region "$AWS_REGION" \
              --query Status --output text)
            [[ "$STATUS" == CREATE_PENDING || "$STATUS" == CREATE_IN_PROGRESS ]] || break
            sleep 5
          done
          if [[ "$STATUS" == FAILED ]]; then
            REASON=$(aws cloudformation describe-change-set --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET" --region "$AWS_REGION" \
              --query StatusReason --output text)
            if [[ "$TYPE" == UPDATE && "$REASON" == *"didn't contain changes"* ]]; then
              echo 'Infrastructure unchanged; existing EC2 stack retained.'
              aws cloudformation delete-change-set --stack-name "$STACK_NAME" \
                --change-set-name "$CHANGE_SET" --region "$AWS_REGION"
              exit 0
            fi
            echo "CloudFormation change set failed: $REASON" >&2
            exit 1
          fi
          [[ "$STATUS" == CREATE_COMPLETE ]] || { echo "Change set status: $STATUS" >&2; exit 1; }

          aws cloudformation describe-change-set --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET" --region "$AWS_REGION" \
            --query 'Changes[].ResourceChange.{Action:Action,Resource:LogicalResourceId,Replacement:Replacement}' \
            --output json > /tmp/buttersveg-changes.json
          cat /tmp/buttersveg-changes.json

          # On existing infrastructure, never silently delete/replace resources.
          # Replacement of EC2 can destroy the original root disk and its data.
          if [[ "$TYPE" == UPDATE ]]; then
            python3 - <<'PY_CHECK'
          import json
          changes = json.load(open('/tmp/buttersveg-changes.json', encoding='utf-8'))
          risky = [c for c in changes if c['Action'] == 'Remove' or c['Replacement'] in ('True', 'Conditional')]
          if risky:
              raise SystemExit('Stopped: change set would remove or possibly replace resources: ' + str(risky))
          PY_CHECK
          fi

          # Execute automatically; there is no manual stack creation or approval step.
          aws cloudformation execute-change-set --stack-name "$STACK_NAME" \
            --change-set-name "$CHANGE_SET" --region "$AWS_REGION"
          if [[ "$TYPE" == CREATE ]]; then
            aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          else
            aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          fi
          echo "CloudFormation $TYPE completed for $STACK_NAME"

      - name: Start the stack's EC2 instance and wait for Systems Manager
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id WebInstance \
            --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]] || { echo "Invalid instance ID: $INSTANCE_ID"; exit 1; }
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [[ "$STATE" == stopping ]]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            STATE=stopped
          fi
          if [[ "$STATE" == stopped ]]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" >/dev/null
          elif [[ "$STATE" != running && "$STATE" != pending ]]; then
            echo "Unexpected EC2 state $STATE" >&2
            exit 1
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
          for attempt in $(seq 1 60); do
            PING=$(aws ssm describe-instance-information --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$PING" == Online ]]; then
              echo "EC2 $INSTANCE_ID is running and SSM is online"
              exit 0
            fi
            sleep 10
          done
          echo 'EC2 started but Systems Manager never reported Online.' >&2
          exit 1

      - name: Deploy exactly the released ECR image and check application health
        shell: bash
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || exit 1

          # AWS-RunShellScript executes as root on the existing instance.
          cat > /tmp/buttersveg-update.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail
          timeout 900 cloud-init status --wait >/dev/null
          systemctl is-active --quiet docker
          AWS_REGION='__REGION__'
          ACCOUNT_ID='__ACCOUNT__'
          IMAGE_TAG='__IMAGE_TAG__'
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          NEW_IMAGE="$REGISTRY/butters-veg:$IMAGE_TAG"
          CONTAINER=butters-veg
          LOG_GROUP=/butters-veg/buttersveg-ec2
          LOG_STREAM=buttersveg-ec2-application

          run_container() {
            docker run --detach --name "$CONTAINER" --restart unless-stopped \
              --publish 8080:8080 \
              --log-driver awslogs --log-opt "awslogs-region=$AWS_REGION" \
              --log-opt "awslogs-group=$LOG_GROUP" --log-opt "awslogs-stream=$LOG_STREAM" \
              --env PORT=8080 "$1" >/dev/null
          }
          healthy() {
            for attempt in $(seq 1 45); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:8080/health >/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }

          OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)
          if [[ "$OLD_IMAGE" == "$NEW_IMAGE" ]] && healthy; then
            echo "Already healthy: $NEW_IMAGE"
            exit 0
          fi
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY" >/dev/null
          docker pull "$NEW_IMAGE"
          docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
          if run_container "$NEW_IMAGE" && healthy; then
            echo "Deployment succeeded: $NEW_IMAGE"
            exit 0
          fi

          echo 'New image did not pass /health; trying to restore prior container' >&2
          docker logs --tail 40 "$CONTAINER" >&2 || true
          docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
          if [[ -n "$OLD_IMAGE" ]]; then
            if run_container "$OLD_IMAGE" && healthy; then
              echo "Previous image restored: $OLD_IMAGE" >&2
            else
              echo 'Restoration attempt failed.' >&2
            fi
          fi
          exit 1
          REMOTE
          sed -i -e "s/__REGION__/$AWS_REGION/g" \
            -e "s/__ACCOUNT__/$ACCOUNT_ID/g" \
            -e "s/__IMAGE_TAG__/$RELEASE_IMAGE_TAG/g" /tmp/buttersveg-update.sh
          python3 - <<'PY_ARGS'
          import json
          from pathlib import Path
          script = Path('/tmp/buttersveg-update.sh').read_text()
          Path('/tmp/buttersveg-ssm.json').write_text(json.dumps({
              'commands': [script], 'executionTimeout': ['1200']
          }))
          PY_ARGS

          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --region "$AWS_REGION" \
            --parameters file:///tmp/buttersveg-ssm.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command ID: $COMMAND_ID"
          STATUS=Pending
          for attempt in $(seq 1 130); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform|AccessDenied)
                break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json
          [[ "$STATUS" == Success ]] || { echo "Deployment failed: $STATUS" >&2; exit 1; }
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo 'Butters Veg EC2 deployment completed successfully.'
          echo "Website (from approved IP only): http://$PUBLIC_IP:8080/"

  # DEVELOPMENT / TESTING ONLY: when the nightly schedule has stopped EC2,
  # use Actions > Butters Veg EC2 Deploy > Run workflow to restart it.
  # This does NOT create a new instance or change the CloudFormation stack.
  # When nightly shutdown is disabled, this job is no longer needed.
  start-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: eu-north-1
      STACK_NAME: butters-veg-ec2
    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          mask-aws-account-id: true

      - name: Restart existing EC2 and verify application health
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws cloudformation describe-stack-resource \
            --stack-name "$STACK_NAME" --logical-resource-id WebInstance \
            --region "$AWS_REGION" --query 'StackResourceDetail.PhysicalResourceId' --output text)
          [[ "$INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]] || { echo 'EC2 stack is not deployed yet.' >&2; exit 1; }
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" --query 'Reservations[0].Instances[0].State.Name' --output text)
          if [[ "$STATE" == stopping ]]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
            STATE=stopped
          fi
          if [[ "$STATE" == stopped ]]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" >/dev/null
          elif [[ "$STATE" != running && "$STATE" != pending ]]; then
            echo "Cannot restart instance in state $STATE" >&2
            exit 1
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region "$AWS_REGION"
          for attempt in $(seq 1 60); do
            PING=$(aws ssm describe-instance-information --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$PING" == Online ]]; then break; fi
            sleep 10
          done
          [[ "$PING" == Online ]] || { echo 'SSM did not become available.' >&2; exit 1; }
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" \
            --document-name AWS-RunShellScript --instance-ids "$INSTANCE_ID" \
            --parameters '{"commands":["for n in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && exit 0; sleep 3; done; exit 1"]}' \
            --query 'Command.CommandId' --output text)
          STATUS=Pending
          for attempt in $(seq 1 45); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Undeliverable|Terminated) break ;;
            esac
            sleep 5
          done
          [[ "$STATUS" == Success ]] || { echo "Restart health check failed: $STATUS" >&2; exit 1; }
          echo "Existing EC2 $INSTANCE_ID restarted and /health passed."
